<!DOCTYPE html>

<style>
  :root { --primary: #121315; --secondary: #1a1c20; --accent: #c59b27; --gold: #d4af37; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .hub-card { background: #1e293b; border: 2px solid var(--accent); border-radius: 16px; padding: 40px 30px; max-width: 520px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .hub-logo { max-height: 70px; margin-bottom: 20px; border-radius: 8px; border: 1px solid var(--accent); padding: 4px; background: #000; }
  h1 { font-size: 1.5rem; color: var(--gold); margin-bottom: 8px; }
  p { font-size: 0.88rem; color: #94a3b8; margin-bottom: 28px; }
  .btn-module { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 18px; margin-bottom: 16px; border-radius: 10px; font-size: 1rem; font-weight: 700; text-decoration: none; transition: 0.2s; }
  .btn-locacao { background: linear-gradient(135deg, #c59b27, #dfba48); color: #121315; }
  .btn-cliente { background: #334155; color: #fff; border: 1px solid #475569; }
  .btn-module:hover { transform: translateY(-2px); opacity: 0.95; }
</style>
<style id="mic-mobile-20261121">

 .grid-2,.grid-3 {grid-template-columns:minmax(0,1fr);}
 .grid-2>*,.grid-3>*,.registros-split-layout>* {min-width:0;}

 dialog form>div {flex-wrap:wrap;}
 .auth-card {max-height:calc(100dvh - 32px);overflow:auto;padding:20px 16px;}
 #auth-modal,#mfa-modal,#modal-hub,#pdf-modal,#reajuste-modal,#relatorio-modal {overflow-y:auto;}

<style id="mic-mobile-v2">
.m2-only{display:none!important}
@media screen and (max-width:800px){
 body{background:#f2f4f7!important;font-size:16px;line-height:1.45}
 header{padding:14px 16px!important;border-bottom:3px solid #c59b27!important;gap:12px!important}
 header h1{font-size:15px!important;line-height:1.35!important;letter-spacing:0!important}
 header p{font-size:11px!important} header img{max-height:38px!important}
 .container{padding:0 12px 30px!important;margin:12px auto!important}
 .m2-only{display:block!important}
 .m2-original-nav{position:static!important;padding:0!important;margin:0!important;border:0!important;background:none!important}

 .m2-nav{position:sticky;top:0;z-index:60;background:#18231f;border-radius:13px;padding:10px 12px;margin:0 0 16px;box-shadow:0 5px 18px #13231c20;color:#ddc381;display:block}

 .tabela-registro-form,.planilha-tabela{min-width:0!important;width:100%!important}
 .tabela-registro-form td,.planilha-tabela td{overflow-wrap:anywhere}
 .m2-expanded td{min-width:0!important}
 #tab-imoveis .mic-metrics{gap:8px;background:transparent;border:0;padding:0;grid-template-columns:1fr 1fr}
 #tab-imoveis .mic-metrics>*{background:#fff!important;border:1px solid #dce5df!important;border-top:3px solid #b7953c!important;border-radius:12px;padding:14px!important}
 #tab-imoveis .mic-metrics strong{font-size:23px!important}
 #tab-imoveis .mic-heading{padding:6px 0 16px}#tab-imoveis h2{font-size:24px}
 #mic-ficha .mic-drawer{padding:18px;width:100%;padding-bottom:40px}

<body>
<div class="hub-card">
  <img src="/Loga%20marca%20nova.png" class="hub-logo" onerror="this.src='/Loga marca nova.png'">
  <h1>M&IC CORRETORES</h1>
  <p>Selecione o módulo operacional que deseja acessar:</p>
  <a href="/" class="btn-module btn-locacao">🏢 Administração de Imóvel (Locações)</a>
  <a href="/clientes" class="btn-module btn-cliente">👥 Administração do Cliente (Produção)</a>
</div>
<script id="mic-mobile-v2-ui">
/* Navegação e apresentação mobile. Mantém os campos e eventos originais. */
(() => {
  const mq = matchMedia('(max-width: 800px)');
  const all = (s, root = document) => [...root.querySelectorAll(s)];
  function button(text, action) {
    const el = document.createElement('button'); el.type = 'button'; el.className = 'm2-control';
    el.textContent = text; el.addEventListener('click', action); return el;
  }
  const tabs = all('.main-tabs .tab-nav-btn, .tabs .tab-btn');
  if (tabs.length) {
    const original = tabs[0].closest('.main-tabs, .tabs');
    const bar = document.createElement('label'); bar.className = 'm2-nav m2-only';
    const title = document.createElement('span'); title.textContent = 'NAVEGAR';
    const select = document.createElement('select'); select.setAttribute('aria-label', 'Selecionar módulo');
    tabs.forEach((tab, i) => { const o = document.createElement('option'); o.value = i; o.textContent = tab.textContent.trim(); select.append(o); });
    select.addEventListener('change', () => tabs[Number(select.value)].click());
    const sync = () => { const i = tabs.findIndex(t => t.classList.contains('active')); if (i >= 0) select.value = i; };
    tabs.forEach(t => new MutationObserver(sync).observe(t, {attributes:true, attributeFilter:['class']}));
    bar.append(title, select); original.before(bar); original.classList.add('m2-original-nav'); sync();
  }
  function accordion(node, heading) {
    if (!node || node.dataset.m2Accordion) return;
    node.dataset.m2Accordion = '1';
    const control = button(heading + ' · Abrir', () => {
      const closed = node.classList.toggle('m2-collapsed');
      control.setAttribute('aria-expanded', String(!closed)); control.textContent = heading + (closed ? ' · Abrir' : ' · Fechar');
    });
    control.classList.add('m2-only', 'm2-accordion'); control.setAttribute('aria-expanded', 'false');
    node.classList.add('m2-collapsed'); node.before(control);
  }
  all('.doc-hub-column > .doc-block').forEach(block => {
    const title = block.querySelector('.doc-block-title');
    accordion(block, title?.textContent.trim() || 'Documentos');
  });
  const firstForm = document.querySelector('#page-producao form');
  accordion(firstForm, 'Novo lançamento');
  const stages = document.querySelector('#tbody-tabela-registro, #tabelaCorpo');
  let stageKey = '';
  if (stages) {
    const bar = document.createElement('label'); bar.className = 'm2-stage m2-only';
    bar.textContent = 'ETAPA DO PREENCHIMENTO';
    const select = document.createElement('select'); select.setAttribute('aria-label','Etapa das certidões'); bar.append(select);
    stages.closest('table').before(bar);
    function updateStages() {
      const headings = all('.titulo-secao-reg, .titulo-secao', stages);
      const names = headings.map(h => h.textContent.trim());
      if (names.join('|') !== stageKey) {
        stageKey = names.join('|'); select.replaceChildren();
        names.forEach((name, i) => { const o = document.createElement('option'); o.value = i; o.textContent = name; select.append(o); });
      }
      let group = -1;
      all('tr', stages).forEach(row => {
        if (row.querySelector('.titulo-secao-reg, .titulo-secao')) group++;
        row.classList.toggle('m2-other-stage', group >= 0 && group !== Number(select.value));
      });
    }
    select.addEventListener('change', updateStages);
    new MutationObserver(updateStages).observe(stages, {childList:true}); updateStages();
  }
  const configs = [
    ['#tabela-corpo', [3,4,5,6], 3],
    ['#tabela-imoveis-linear-body', [1,2,3], 1],
    ['#tabela-taxas-body', [0,1,12], 1],
    ['#tabela-gerencial-fluxo-body', [0,1,3,4], 0]
  ];
  configs.forEach(([selector, keep, target]) => {
    const body = document.querySelector(selector); if (!body) return;
    function enhance() {
      all(':scope > tr', body).forEach(row => {
        const cells = [...row.cells]; if (cells.length < 5 || row.querySelector('.m2-expand')) return;
        row.classList.add('m2-compact');
        cells.forEach((cell, i) => { if (!keep.includes(i)) cell.classList.add('m2-secondary'); });
        const b = button('Ver todos os detalhes', () => {
          const expanded = row.classList.toggle('m2-expanded');
          b.textContent = expanded ? 'Recolher detalhes' : 'Ver todos os detalhes'; b.setAttribute('aria-expanded', String(expanded));
        });
        b.classList.add('m2-only','m2-expand'); b.setAttribute('aria-expanded','false'); cells[target].append(b);
      });
    }
    new MutationObserver(enhance).observe(body, {childList:true}); enhance();
  });
  // Nenhum valor é clonado: alternar tamanho da tela preserva os inputs originais.
  mq.addEventListener('change', () => document.activeElement?.blur());
})();

</script>
</body>
</html>
