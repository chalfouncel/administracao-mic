<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal M&IC Corretores</title>
<link rel="icon" type="image/png" href="/Loga%20marca%20nova.png">
<style>
  :root { --primary: #121315; --secondary: #1a1c20; --accent: #c59b27; --gold: #d4af37; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .hub-card { background: #1e293b; border: 2px solid var(--accent); border-radius: 16px; padding: 40px 30px; max-width: 520px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .hub-logo { max-height: 70px; margin-bottom: 20px; border-radius: 8px; border: 1px solid var(--accent); padding: 4px; background: #000; }
  h1 { font-size: 1.5rem; color: var(--gold); margin-bottom: 8px; }
  p { font-size: 0.88rem; color: #94a3b8; margin-bottom: 28px; }
  .btn-module { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 18px; margin-bottom: 16px; border-radius: 10px; font-size: 1rem; font-weight: 700; text-decoration: none; transition: 0.2s; }
  .btn-locacao { background: linear-gradient(135deg, #c59b27, #dfba48); color: #121315; }
  .btn-cliente { background: #334155; color: #fff; border: 1px solid #475569; }
  .btn-module:hover { transform: translateY(-2px); opacity: 0.95; }
</style>
<style id="mic-mobile-20261121">

@media screen and (max-width: 800px) {
 html,body {height:auto!important;min-height:100%;overflow-x:clip;overflow-y:auto!important;}
 body {font-size:16px;}
 body>.container {display:block;max-width:100%;width:100%;margin:12px auto;padding:0 12px 28px;}
 header {flex-wrap:wrap;gap:12px;padding:14px 12px;}
 header .brand-area {min-width:0;gap:10px;} header h1 {font-size:1rem;overflow-wrap:anywhere;} header p {font-size:.8rem;}
 header>div:last-child {flex-wrap:wrap;gap:8px;max-width:100%;overflow-wrap:anywhere;}
 .card {padding:14px!important;border-radius:12px;min-width:0;}
 .card-title {gap:10px;flex-wrap:wrap;align-items:flex-start;font-size:1rem;}
 .card-title>div {flex-wrap:wrap;max-width:100%;}
 input:not([type=checkbox]):not([type=radio]),select,textarea {font-size:16px!important;min-height:44px;max-width:100%;box-sizing:border-box;}
 label {font-size:.85rem!important;line-height:1.4;}
 button,.btn,.doc-link-btn {min-height:44px;white-space:normal;touch-action:manipulation;}
 .btn {height:auto!important;font-size:.875rem!important;padding:10px 12px!important;}
 input[type=checkbox] {width:22px!important;height:22px!important;}
 .tabs {display:flex;position:sticky;top:0;z-index:40;gap:8px;padding:10px 0;background:var(--bg,#f4f6f9);overflow-x:auto;scrollbar-width:thin;}
 .tab-btn {flex:0 0 auto;min-height:46px;padding:10px 14px;border-radius:8px;font-size:.875rem;}
 .grid-2,.grid-3 {grid-template-columns:minmax(0,1fr);}
 .grid-2>*,.grid-3>*,.registros-split-layout>* {min-width:0;}
 dialog {max-height:calc(100dvh - 24px);max-width:calc(100vw - 24px);padding:18px!important;overflow:auto;}
 dialog form>div {flex-wrap:wrap;}
 .auth-card {max-height:calc(100dvh - 32px);overflow:auto;padding:20px 16px;}
 #auth-modal,#mfa-modal,#modal-hub,#pdf-modal,#reajuste-modal,#relatorio-modal {overflow-y:auto;}
 .hub-card {padding:24px 18px;} .btn-module {min-height:64px;line-height:1.5;}
}
</style>
</head>
<body>
<div class="hub-card">
  <img src="/Loga%20marca%20nova.png" class="hub-logo" onerror="this.src='/Loga marca nova.png'">
  <h1>M&IC CORRETORES</h1>
  <p>Selecione o módulo operacional que deseja acessar:</p>
  <a href="/" class="btn-module btn-locacao">🏢 Administração de Imóvel (Locações)</a>
  <a href="/clientes" class="btn-module btn-cliente">👥 Administração do Cliente (Produção)</a>
</div>
</body>
</html>
