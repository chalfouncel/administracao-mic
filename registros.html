<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registros - M&IC</title>
    <!-- Usando Bootstrap para o visual ficar bonito e padrão -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Estilos para deixar com cara de planilha organizada */
        .planilha-tabela {
            background-color: white;
            box-shadow: 0 0 15px rgba(0,0,0,0.05);
        }
        .planilha-tabela th, .planilha-tabela td {
            vertical-align: middle;
            padding: 0.5rem;
        }
        /* Remove as bordas dos inputs para parecer que a própria célula é o campo */
        .input-planilha {
            border: 1px solid transparent;
            border-radius: 0;
            width: 100%;
            padding: 4px 8px;
        }
        .input-planilha:focus {
            outline: none;
            border-bottom: 2px solid #0d6efd;
            background-color: #f8f9fa;
        }
        /* O fundo amarelo e verde claro */
        .bg-certidao {
            background-color: #fff9c4 !important;
            font-weight: 500;
        }
        .bg-verde-claro {
            background-color: #d1e7dd !important; /* Verde claro do Bootstrap */
            font-weight: 500;
        }
        .titulo-secao {
            background-color: #f1f3f5;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
        }
        /* Ajuste para o grupo do input ficar alinhado */
        .grupo-certidao {
            display: flex;
            align-items: center;
            gap: 5px;
            background-color: white;
        }
    </style>
<style id="mic-mobile-20261121">

 body {font-size:16px;}

 header {flex-wrap:wrap;gap:12px;padding:14px 12px;}
 header .brand-area {min-width:0;gap:10px;} header h1 {font-size:1rem;overflow-wrap:anywhere;} header p {font-size:.8rem;}
 header>div:last-child {flex-wrap:wrap;gap:8px;max-width:100%;overflow-wrap:anywhere;}
 .card {padding:14px!important;border-radius:12px;min-width:0;}
 .card-title {gap:10px;flex-wrap:wrap;align-items:flex-start;font-size:1rem;}
 .card-title>div {flex-wrap:wrap;max-width:100%;}
 input:not([type=checkbox]):not([type=radio]),select,textarea {font-size:16px!important;min-height:44px;max-width:100%;box-sizing:border-box;}
 label {font-size:.85rem!important;line-height:1.4;}
 button,.btn,.doc-link-btn {min-height:44px;white-space:normal;touch-action:manipulation;}

 .tab-btn {flex:0 0 auto;min-height:46px;padding:10px 14px;border-radius:8px;font-size:.875rem;}

 .grid-2>*,.grid-3>*,.registros-split-layout>* {min-width:0;}

}

@media screen and (max-width:800px){
 .tabela-registro-form,.planilha-tabela {display:block;width:100%;}
 .tabela-registro-form thead,.planilha-tabela thead {display:none;}
 .tabela-registro-form tbody,.planilha-tabela tbody {display:block;}
 .tabela-registro-form tr,.planilha-tabela tr {display:flex;flex-wrap:wrap;margin-bottom:10px;gap:8px;}
 .tabela-registro-form td,.planilha-tabela td {display:block;flex:1 1 100%;min-width:0;width:100%;border:0;padding:4px 0;}
 .tabela-registro-form td:empty,.planilha-tabela td:empty {display:none;}
 .tabela-registro-form td.titulo-secao-reg,.planilha-tabela td.titulo-secao {padding:12px;border-radius:8px;margin-top:14px;}
 .tabela-registro-form input,.planilha-tabela input {min-width:0;border:1px solid #cbd5e1;border-radius:6px;padding:10px;}

 #formularioContainer>.d-flex {flex-wrap:wrap;gap:10px;}

</head>
<body class="bg-light">

    <div class="container mt-5">
        <h2 class="mb-4">Módulo de Registros</h2>

        <!-- PASSO 1: O POPUP/CARD DE CONFIGURAÇÃO -->
        <div id="setupCard" class="card shadow-sm mx-auto" style="max-width: 500px;">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Novo Registro</h5>
            </div>
            <div class="card-body">
                <p class="text-muted">Informe as quantidades para gerar o formulário.</p>
                <div class="row mb-3">
                    <div class="col-6">
                        <label>Qtd. de Vendedores</label>
                        <input type="number" id="qtdVendedores" class="form-control" value="1" min="1">
                    </div>
                    <div class="col-6">
                        <label>Qtd. de Compradores</label>
                        <input type="number" id="qtdCompradores" class="form-control" value="1" min="1">
                    </div>
                </div>
                <button class="btn btn-primary w-100" onclick="gerarFormulario()">Gerar Formulário</button>
            </div>
        </div>

        <!-- PASSO 2: O FORMULÁRIO DINÂMICO -->
        <div id="formularioContainer" style="display: none;">
            <div class="d-flex justify-content-between mb-2">
                <button class="btn btn-outline-secondary btn-sm" onclick="voltarSetup()">← Voltar e Refazer</button>
                <button class="btn btn-success btn-sm">Salvar Registro</button>
            </div>
            
            <div class="table-responsive">
                <table class="table table-bordered planilha-tabela">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 15%;">Campo</th>
                            <th style="width: 35%;">Dados</th>
                            <th style="width: 25%; text-align: center;">Civil</th>
                            <th style="width: 25%; text-align: center;">Fazendária</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCorpo">
                        <!-- O Javascript vai injetar as linhas aqui! -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // Função para alternar entre amarelo e verde
        function toggleVerde(botao) {
            const input = botao.previousElementSibling; // Pega o input que está antes do botão
            if (input.classList.contains('bg-certidao')) {
                input.classList.remove('bg-certidao');
                input.classList.add('bg-verde-claro');
            } else {
                input.classList.remove('bg-verde-claro');
                input.classList.add('bg-certidao');
            }
        }

        function gerarFormulario() {
            const qtdVend = parseInt(document.getElementById('qtdVendedores').value) || 1;
            const qtdComp = parseInt(document.getElementById('qtdCompradores').value) || 1;
            
            let html = '';

            // 1. GERAR VENDEDORES
            for(let i = 1; i <= qtdVend; i++) {
                html += `
                    <tr><td colspan="4" class="titulo-secao">VENDEDOR ${i}</td></tr>
                    <tr>
                        <td><strong>Nome</strong></td>
                        <td><input type="text" class="input-planilha" placeholder="Nome do vendedor..."></td>
                        <td>
                            <div class="grupo-certidao">
                                <input type="text" class="input-planilha bg-certidao" placeholder="Nº Certidão Civil">
                                <button type="button" class="btn btn-sm btn-light border" onclick="toggleVerde(this)" title="Marcar como concluída">✅</button>
                                <a href="#" target="_blank" class="btn btn-sm" style="background-color: #0b194d; color: white;">Acessar ↗</a>
                            </div>
                        </td>
                        <td>
                            <div class="grupo-certidao">
                                <input type="text" class="input-planilha bg-certidao" placeholder="Nº Cert. Fazendária">
                                <button type="button" class="btn btn-sm btn-light border" onclick="toggleVerde(this)" title="Marcar como concluída">✅</button>
                                <a href="#" target="_blank" class="btn btn-sm" style="background-color: #0b194d; color: white;">Acessar ↗</a>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td><strong>CPF</strong></td>
                        <td><input type="text" class="input-planilha" placeholder="000.000.000-00"></td>
                        <td class="bg-light"></td><td class="bg-light"></td>
                    </tr>
                    <tr>
                        <td><strong>Nasc.</strong></td>
                        <td><input type="date" class="input-planilha"></td>
                        <td class="bg-light"></td><td class="bg-light"></td>
                    </tr>
                    <tr>
                        <td><strong>Pai</strong></td>
                        <td><input type="text" class="input-planilha"></td>
                        <td class="bg-light"></td><td class="bg-light"></td>
                    </tr>
                    <tr>
                        <td><strong>Mãe</strong></td>
                        <td><input type="text" class="input-planilha"></td>
                        <td class="bg-light"></td><td class="bg-light"></td>
                    </tr>
                `;
            }

            // 2. GERAR DADOS DO IMÓVEL
            html += `
                <tr><td colspan="4" class="titulo-secao">DADOS DO IMÓVEL</td></tr>
                <tr>
                    <td><strong>End</strong></td>
                    <td><input type="text" class="input-planilha" placeholder="Rua..."></td>
                    <td class="bg-light"></td>
                    <td>
                        <div class="grupo-certidao">
                            <input type="text" class="input-planilha bg-certidao" placeholder="Nº Cert. Fazendária">
                            <button type="button" class="btn btn-sm btn-light border" onclick="toggleVerde(this)" title="Marcar como concluída">✅</button>
                            <a href="#" target="_blank" class="btn btn-sm" style="background-color: #0b194d; color: white;">Acessar ↗</a>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td><strong>Num</strong></td><td><input type="text" class="input-planilha"></td>
                    <td class="bg-light"></td><td class="bg-light"></td>
                </tr>
                <tr>
                    <td><strong>Compl</strong></td><td><input type="text" class="input-planilha"></td>
                    <td class="bg-light"></td><td class="bg-light"></td>
                </tr>
                <tr>
                    <td><strong>Compl</strong></td><td><input type="text" class="input-planilha"></td>
                    <td class="bg-light"></td><td class="bg-light"></td>
                </tr>
                <tr>
                    <td><strong>CEP</strong></td><td><input type="text" class="input-planilha"></td>
                    <td class="bg-light"></td><td class="bg-light"></td>
                </tr>
                <tr>
                    <td><strong>Matric.</strong></td><td><input type="text" class="input-planilha"></td>
                    <td class="bg-light"></td><td class="bg-light"></td>
                </tr>
                <tr>
                    <td><strong>Cartório</strong></td><td><input type="text" class="input-planilha"></td>
                    <td class="bg-light"></td><td class="bg-light"></td>
                </tr>
                <tr>
                    <td><strong>IPTU</strong></td><td><input type="text" class="input-planilha"></td>
                    <td class="bg-light"></td><td class="bg-light"></td>
                </tr>
            `;

            // 3. GERAR COMPRADORES
            html += `<tr><td colspan="4" class="titulo-secao">COMPRADORES</td></tr>`;
            for(let i = 1; i <= qtdComp; i++) {
                html += `
                    <tr>
                        <td><strong>Nome/CPF ${i}</strong></td>
                        <td><input type="text" class="input-planilha" placeholder="Nome do comprador ${i}"></td>
                        <td colspan="2"><input type="text" class="input-planilha" placeholder="CPF do comprador ${i}"></td>
                    </tr>
                `;
            }

            // 4. POSIÇÃO ITBI
            html += `
                <tr><td colspan="4" class="titulo-secao">SITUAÇÃO DO REGISTRO</td></tr>
                <tr>
                    <td><strong>POSIÇÃO ITBI</strong></td>
                    <td colspan="3"><input type="text" class="input-planilha font-weight-bold" placeholder="Ex: CERTIDÃO EMITIDA E ARQUIVADA" style="text-transform: uppercase;"></td>
                </tr>
            `;

            // Injeta o HTML na tabela e troca as telas
            document.getElementById('tabelaCorpo').innerHTML = html;
            document.getElementById('setupCard').style.display = 'none';
            document.getElementById('formularioContainer').style.display = 'block';
        }

        function voltarSetup() {
            document.getElementById('formularioContainer').style.display = 'none';
            document.getElementById('setupCard').style.display = 'block';
        }
    </script>
</body>
</html>
